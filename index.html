<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>D2 Survivors 金幣修改書籤安裝器</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #121212; color: #fff; }
        .bookmark-btn { 
            padding: 15px 30px; 
            font-size: 18px; 
            background-color: #ffcc00; 
            color: #000; 
            border: none; 
            cursor: grab; 
            font-weight: bold; 
            border-radius: 5px; 
            text-decoration: none; 
            display: inline-block; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .bookmark-btn:active { cursor: grabbing; }
        .bookmark-btn:hover { background-color: #e6b800; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 10px; display: inline-block; max-width: 600px; text-align: left; }
        ol { line-height: 1.8; }
        .tip { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>
    <h1>D2 Survivors 金幣修改工具安裝</h1>
    <div class="box">
        <p><b>安裝方法超簡單：</b></p>
        <ol>
            <li>請確保你的瀏覽器有顯示「書籤列」（若沒有請按 <span class="tip">Ctrl + Shift + B</span> 開啟）。</li>
            <li>用滑鼠<span class="tip">按住下方黃色按鈕不放</span>，直接把它<span class="tip">拖曳到你的書籤列</span>放開！</li>
        </ol>
        <br>
        <div style="text-align: center;">
            <!-- 這是一個可以直接拖曳到書籤列的書籤連結 -->
            <a class="bookmark-btn" href="javascript:(function(){let rawData=localStorage.getItem('d2-survivors/save/v1');if(!rawData){let saveKey=Object.keys(localStorage).find(k=>localStorage.getItem(k).includes('gold'));if(saveKey){rawData=localStorage.getItem(saveKey);let data=JSON.parse(rawData);data.gold=999999;localStorage.setItem(saveKey,JSON.stringify(data));alert('✨ 金幣修改成功！請按 F5 重新整理！');return;}alert('❌ 找不到遊戲存檔，請確認你正在 https://d2survivors.lol 遊戲頁面中！');return;}let data=JSON.parse(rawData);data.gold=9999999;localStorage.setItem('d2-survivors/save/v1',JSON.stringify(data));localStorage.removeItem('d2-survivors/save/v1/unreadable');alert('✨ 成功！金幣已改為 9,999,999，請按 F5 重新整理！');})();">🔥 D2 Survivors 改金幣</a>
        </div>
        <br><br>
        <p><b>使用方法：</b></p>
        <p>打開遊戲網頁 <a href="https://d2survivors.lol/play/" target="_blank" style="color: #ffcc00;">D2 Survivors 遊戲</a>，進入遊戲後點一下剛才拖過去的書籤，金幣就會變成 9,999,999，再按 F5 重新整理就大功告成了！</p>
    </div>
</body>
</html>
